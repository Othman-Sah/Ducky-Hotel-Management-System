<svg width="2000" height="1400" xmlns="http://www.w3.org/2000/svg">

<defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
</defs>

<style>
    .node { rx:12; stroke:#000; stroke-width:2; }
    .small-node { rx:8; stroke:#000; stroke-width:1.5; }
    .container { rx:16; stroke:#000; stroke-width:2.5; }
    .title { font-family:Arial, sans-serif; font-size:32px; font-weight:bold; fill:#000; }
    .section-title { font-family:Arial, sans-serif; font-size:24px; font-weight:bold; fill:#000; }
    .container-title { font-family:Arial, sans-serif; font-size:20px; font-weight:bold; fill:#000; }
    .txt { font-family:Arial, sans-serif; font-size:16px; font-weight:600; fill:#000; }
    .small-txt { font-family:Arial, sans-serif; font-size:14px; font-weight:600; fill:#000; }
    .annot-box { rx:6; stroke:#000; stroke-width:1.5; }
    .annot-text { font-family:Arial, sans-serif; font-size:13px; fill:#000; }
    .annot-label { font-family:Arial, sans-serif; font-size:13px; font-weight:bold; fill:#000; }
    .connector { stroke:#000; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    .section-connector { stroke:#000; stroke-width:2.5; fill:none; marker-end:url(#arrowhead); }
</style>

<!-- Background -->
<rect width="2000" height="1400" fill="#fff"/>

<!-- Title -->
<text x="1000" y="50" class="title" text-anchor="middle">SYSTÈME DE GESTION HÔTELIÈRE</text>

<!-- ========================================================== -->
<!-- ======================  LOGIN SECTION  ==================== -->
<!-- ========================================================== -->

<text x="1000" y="110" class="section-title" text-anchor="middle">LOGIN</text>

<!-- LOGIN Node -->
<rect x="850" y="130" width="300" height="70" fill="#9d6bff" class="node"/>
<text x="1000" y="172" class="txt" text-anchor="middle">PAGE DE CONNEXION</text>

<rect x="1200" y="130" width="250" height="90" fill="#c9e4ff" class="annot-box"/>
<text x="1220" y="153" class="annot-label">Classe: Auth</text>
<text x="1220" y="173" class="annot-text">• login()</text>
<text x="1220" y="193" class="annot-text">• authenticate()</text>

<!-- Connectors to Admin and Client -->
<path d="M 900 200 L 900 330 L 450 330" class="section-connector"/>
<path d="M 1100 200 L 1100 330 L 1550 330" class="section-connector"/>

<!-- Admin Access -->
<rect x="300" y="290" width="300" height="70" fill="#e0e0e0" class="node"/>
<text x="450" y="332" class="txt" text-anchor="middle">ACCÈS ADMIN</text>

<rect x="50" y="290" width="220" height="90" fill="#c9e4ff" class="annot-box"/>
<text x="70" y="313" class="annot-label">Classe: AdminUser</text>
<text x="70" y="333" class="annot-text">Héritage(Auth)</text>
<text x="70" y="353" class="annot-text">• ouvrirMenuAdmin()</text>

<!-- Client Access -->
<rect x="1400" y="290" width="300" height="70" fill="#aaffc9" class="node"/>
<text x="1550" y="332" class="txt" text-anchor="middle">ACCÈS CLIENT</text>

<rect x="1730" y="290" width="220" height="90" fill="#c9e4ff" class="annot-box"/>
<text x="1750" y="313" class="annot-label">Classe: ClientUser</text>
<text x="1750" y="333" class="annot-text">Héritage(Auth)</text>
<text x="1750" y="353" class="annot-text">• ouvrirMenuClient()</text>

<!-- ========================================================== -->
<!-- =====================  ADMIN SECTION  ===================== -->
<!-- ========================================================== -->

<text x="450" y="470" class="section-title">ESPACE ADMIN</text>

<!-- Big Admin Container -->
<rect x="50" y="500" width="800" height="550" fill="#fff9e6" class="container"/>
<text x="450" y="535" class="container-title" text-anchor="middle">MENU ADMIN</text>

<!-- Chambres -->
<rect x="120" y="580" width="180" height="60" fill="#e0e0e0" class="small-node"/>
<text x="210" y="617" class="small-txt" text-anchor="middle">Chambres</text>

<rect x="120" y="660" width="180" height="110" fill="#c9e4ff" class="annot-box"/>
<text x="135" y="680" class="annot-label">Chambre</text>
<text x="135" y="700" class="annot-text">Agrégation</text>
<text x="135" y="720" class="annot-text">• afficher()</text>
<text x="135" y="740" class="annot-text">• ajouter()</text>
<text x="135" y="760" class="annot-text">• modifier()</text>

<path d="M 210 640 L 210 660" class="connector"/>

<!-- Réservations -->
<rect x="360" y="580" width="180" height="60" fill="#e0e0e0" class="small-node"/>
<text x="450" y="617" class="small-txt" text-anchor="middle">Réservations</text>

<rect x="360" y="660" width="180" height="110" fill="#c9e4ff" class="annot-box"/>
<text x="375" y="680" class="annot-label">Reservation</text>
<text x="375" y="700" class="annot-text">Composition</text>
<text x="375" y="720" class="annot-text">• creer()</text>
<text x="375" y="740" class="annot-text">• modifier()</text>
<text x="375" y="760" class="annot-text">• annuler()</text>

<path d="M 450 640 L 450 660" class="connector"/>

<!-- Clients -->
<rect x="600" y="580" width="180" height="60" fill="#e0e0e0" class="small-node"/>
<text x="690" y="617" class="small-txt" text-anchor="middle">Clients</text>

<rect x="600" y="660" width="180" height="110" fill="#c9e4ff" class="annot-box"/>
<text x="615" y="680" class="annot-label">Client</text>
<text x="615" y="700" class="annot-text">Agrégation</text>
<text x="615" y="720" class="annot-text">• afficherProfil()</text>
<text x="615" y="740" class="annot-text">• gererClient()</text>
<text x="615" y="760" class="annot-text">• rechercher()</text>

<path d="M 690 640 L 690 660" class="connector"/>

<!-- Facturation -->
<rect x="240" y="850" width="180" height="60" fill="#e0e0e0" class="small-node"/>
<text x="330" y="887" class="small-txt" text-anchor="middle">Facturation</text>

<rect x="240" y="930" width="180" height="90" fill="#c9e4ff" class="annot-box"/>
<text x="255" y="950" class="annot-label">Facture</text>
<text x="255" y="970" class="annot-text">Agrégation</text>
<text x="255" y="990" class="annot-text">• calculer()</text>
<text x="255" y="1010" class="annot-text">• generer()</text>

<path d="M 330 910 L 330 930" class="connector"/>

<!-- ========================================================== -->
<!-- =====================  CLIENT SECTION  ==================== -->
<!-- ========================================================== -->

<text x="1550" y="470" class="section-title">ESPACE CLIENT</text>

<!-- Big Client Container -->
<rect x="1150" y="500" width="800" height="550" fill="#f3e6ff" class="container"/>
<text x="1550" y="535" class="container-title" text-anchor="middle">MENU CLIENT</text>

<!-- Ma Réservation -->
<rect x="1250" y="580" width="200" height="60" fill="#aaffc9" class="small-node"/>
<text x="1350" y="617" class="small-txt" text-anchor="middle">Ma Réservation</text>

<rect x="1250" y="660" width="200" height="110" fill="#c9e4ff" class="annot-box"/>
<text x="1265" y="680" class="annot-label">Reservation</text>
<text x="1265" y="700" class="annot-text">Composition</text>
<text x="1265" y="720" class="annot-text">• afficher()</text>
<text x="1265" y="740" class="annot-text">• modifier()</text>
<text x="1265" y="760" class="annot-text">• annuler()</text>

<path d="M 1350 640 L 1350 660" class="connector"/>

<!-- Facture -->
<rect x="1550" y="580" width="200" height="60" fill="#aaffc9" class="small-node"/>
<text x="1650" y="617" class="small-txt" text-anchor="middle">Facture</text>

<rect x="1550" y="660" width="200" height="90" fill="#c9e4ff" class="annot-box"/>
<text x="1565" y="680" class="annot-label">Facture</text>
<text x="1565" y="700" class="annot-text">Agrégation</text>
<text x="1565" y="720" class="annot-text">• consulter()</text>
<text x="1565" y="740" class="annot-text">• payer()</text>

<path d="M 1650 640 L 1650 660" class="connector"/>

<!-- Connection from Admin Access to Admin Container -->
<path d="M 450 360 L 450 500" class="section-connector"/>

<!-- Connection from Client Access to Client Container -->
<path d="M 1550 360 L 1550 500" class="section-connector"/>

</svg>